openapi: 3.0.3
info:
  title: CAB System - Rating API
  version: 1.0.0
  description: Customer rating function available after trip completion.
servers:
- url: /
  description: Relative server placeholder; actual backend URL is not specified in the SRS.
x-traceability:
  businessRequirements:
  - BR-01
  functionalRequirements:
  - FR-04
  useCases:
  - UC-05
  acceptanceCriteria:
  - AC-04
  entities:
  - Đánh giá
  - Khách hàng
  - Tài xế
  - Chuyến đi
paths:
  /trips/{tripId}/ratings:
    post:
      summary: Rate driver after completed trip
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Rating details are intentionally not constrained because the SRS does not define a star scale or comment format.
      responses:
        '201':
          description: Rating recorded.
        '409':
          description: Trip has not been completed.
