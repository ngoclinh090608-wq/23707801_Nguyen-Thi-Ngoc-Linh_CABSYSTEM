openapi: 3.0.3
info:
  title: CAB System - Authentication & Customer Profile API
  version: 1.0.0
  description: Authentication and customer account/profile functions derived from FR-01.
servers:
- url: /
  description: Relative server placeholder; actual backend URL is not specified in the SRS.
x-traceability:
  businessRequirements:
  - BR-01
  functionalRequirements:
  - FR-01
  useCases:
  - UC-01
  acceptanceCriteria:
  - AC-01
  businessRules:
  - RULE-01
  entities:
  - Tài khoản
  - Khách hàng
paths:
  /auth/register:
    post:
      summary: Register customer account
      responses:
        '201':
          description: Customer account registered.
        '400':
          description: Invalid registration data.
  /auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Login successful.
        '401':
          description: Authentication failed.
  /customers/me:
    patch:
      summary: Update customer profile
      responses:
        '200':
          description: Customer profile updated.
        '401':
          description: Authentication required.
