openapi: 3.0.3
info:
  title: CAB System API 02 - Customer Authentication and Profile
  version: 1.0.0
  description: Đặc tả API đăng nhập và cập nhật thông tin cá nhân khách hàng.
servers:
- url: /
  description: Server tương đối để hiển thị đặc tả trên Swagger; URL backend thực tế chưa được SRS xác định.
paths:
  /auth/login:
    post:
      summary: Đăng nhập
      operationId: loginCustomer
      x-traceability:
        businessGoals:
        - BG-01
        businessRequirements:
        - BR-01
        businessProcesses:
        - BPM-01
        functionalRequirements:
        - FR-01
        useCases:
        - UC-01
        businessRules:
        - RULE-01
        acceptanceCriteria:
        - AC-01
        nonFunctionalRequirements:
        - NFR-05
        - NFR-06
        entities:
        - Tài khoản
        - Khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Thông tin đăng nhập. SRS chưa quy định trường cụ thể.
              additionalProperties: true
      responses:
        '200':
          description: Đăng nhập thành công
        '401':
          description: Xác thực thất bại
  /customers/me:
    patch:
      summary: Cập nhật thông tin cá nhân khách hàng
      operationId: updateCustomerProfile
      security:
      - bearerAuth: []
      x-traceability:
        businessGoals:
        - BG-01
        businessRequirements:
        - BR-01
        functionalRequirements:
        - FR-01
        useCases:
        - UC-01
        businessRules:
        - RULE-01
        acceptanceCriteria:
        - AC-01
        nonFunctionalRequirements:
        - NFR-05
        - NFR-06
        entities:
        - Khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Thông tin cá nhân cần cập nhật.
              additionalProperties: true
      responses:
        '200':
          description: Cập nhật thành công
        '401':
          description: Chưa xác thực
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
