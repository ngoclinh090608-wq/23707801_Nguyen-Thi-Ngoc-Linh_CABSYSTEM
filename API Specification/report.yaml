openapi: 3.0.3
info:
  title: CAB System - Report API
  version: 1.0.0
  description: Read-only reporting API. CRUD is not forced because reports are derived
    outputs rather than managed entities in the SRS.
servers:
- url: /
  description: Relative server placeholder for Swagger documentation; backend URL
    is not specified in the SRS.
x-traceability:
  businessRequirements:
  - BR-10
  functionalRequirements:
  - FR-15
  useCases:
  - UC-14
  acceptanceCriteria:
  - AC-15
paths:
  /reports:
    get:
      summary: Get CAB activity reports
      description: Reports include trip count, revenue, completion rate, cancellation
        rate and driver performance.
      responses:
        '200':
          description: Reports returned.
        '403':
          description: Insufficient permission.
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Request could not be processed.
