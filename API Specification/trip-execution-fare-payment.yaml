openapi: 3.0.3
info:
  title: CAB System API 09 - Trip Execution Fare and Payment
  version: 1.0.0
  description: Đặc tả API cập nhật trạng thái chuyến, xác định số tiền phải trả và thanh toán.
servers:
- url: /
  description: Server tương đối để hiển thị đặc tả trên Swagger; URL backend thực tế chưa được SRS xác định.
paths:
  /trips/{tripId}/status:
    patch:
      summary: Cập nhật trạng thái chuyến
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      x-traceability:
        businessGoals:
        - BG-01
        - BG-02
        businessRequirements:
        - BR-02
        businessProcesses:
        - BPM-01
        functionalRequirements:
        - FR-07
        useCases:
        - UC-08
        businessRules:
        - RULE-07
        acceptanceCriteria:
        - AC-07
        nonFunctionalRequirements:
        - NFR-01
        - NFR-05
        entities:
        - Chuyến đi
        - Tài xế
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - ARRIVED_AT_PICKUP
                  - CUSTOMER_PICKED_UP
                  - IN_PROGRESS
                  - COMPLETED
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '400':
          description: Trạng thái không hợp lệ
  /trips/{tripId}/fare:
    get:
      summary: Xem số tiền phải trả sau khi chuyến hoàn thành
      operationId: getTripFare
      security:
      - bearerAuth: []
      x-traceability:
        businessGoals:
        - BG-03
        businessRequirements:
        - BR-05
        businessProcesses:
        - BPM-02
        functionalRequirements:
        - FR-11
        useCases:
        - UC-10
        businessRules:
        - RULE-08
        acceptanceCriteria:
        - AC-11
        nonFunctionalRequirements:
        - NFR-06
        entities:
        - Chuyến đi
        note: Cách tính cước cụ thể chưa được khách hàng chốt.
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Số tiền phải trả
          content:
            application/json:
              schema:
                type: object
                properties:
                  amountDue:
                    type: number
        '409':
          description: Chuyến chưa hoàn thành
  /trips/{tripId}/payments:
    post:
      summary: Thanh toán chuyến đi
      operationId: payTrip
      security:
      - bearerAuth: []
      x-traceability:
        businessGoals:
        - BG-03
        businessRequirements:
        - BR-05
        - BR-06
        businessProcesses:
        - BPM-02
        functionalRequirements:
        - FR-12
        useCases:
        - UC-10
        businessRules:
        - RULE-09
        - RULE-10
        - RULE-11
        acceptanceCriteria:
        - AC-11
        - AC-12
        nonFunctionalRequirements:
        - NFR-03
        - NFR-06
        entities:
        - Thanh toán
        - Chuyến đi
        note: CAB System không lưu trực tiếp thông tin nhạy cảm của thẻ hoặc tài khoản thanh toán.
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - CASH
                  - ELECTRONIC
      responses:
        '200':
          description: Thanh toán được ghi nhận
        '402':
          description: Thanh toán điện tử thất bại; khách hàng được thông báo và có thể xử lý lại
        '409':
          description: Chuyến chưa hoàn thành
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
