openapi: 3.0.3
info:
  title: CAB System - Payment API
  version: 1.0.0
  description: Cash and electronic payment functions using an external payment provider.
servers:
- url: /
  description: Relative server placeholder; actual backend URL is not specified in the SRS.
x-traceability:
  businessRequirements:
  - BR-05
  - BR-06
  businessProcesses:
  - BPM-02
  functionalRequirements:
  - FR-12
  useCases:
  - UC-10
  acceptanceCriteria:
  - AC-11
  - AC-12
  businessRules:
  - RULE-09
  - RULE-10
  - RULE-11
  exceptions:
  - EX-04
  entities:
  - Thanh toán
  - Chuyến đi
  notes:
  - Sensitive card/account information must not be stored directly in CAB System.
paths:
  /trips/{tripId}/payments:
    post:
      summary: Create or record payment
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - CASH
                  - ELECTRONIC
      responses:
        '200':
          description: Payment result recorded.
        '402':
          description: Electronic payment failed; customer must be notified and retry handled according to business policy.
