openapi: 3.0.3
info:
  title: CAB System - Operations & Reporting API
  version: 1.0.0
  description: Operations management and reporting API. CRUD endpoints are included for customers, drivers, vehicles and trips as a technical interpretation of FR-14 'manage customers, drivers, vehicles and trips'. Reporting and transaction lookup are read-only.
servers:
- url: /
  description: Relative server placeholder; actual backend URL is not specified in the SRS.
