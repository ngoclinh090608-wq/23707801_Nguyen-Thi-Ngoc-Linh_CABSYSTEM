paths:
  /operations/customers:
    get:
      summary: List customers
      responses:
        '200':
          description: Customers returned.
        '403':
          description: Insufficient permission.
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Customer data. Exact fields are not fully specified by the SRS.
      responses:
        '201':
          description: Customer created.
        '400':
          description: Invalid request data.
        '403':
          description: Insufficient permission.
  /operations/customers/{customerId}:
    get:
      summary: Get customer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customer returned.
        '404':
          description: Customer not found.
        '403':
          description: Insufficient permission.
    patch:
      summary: Update customer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Fields to update for the customer. Exact fields are not fully specified by the SRS.
      responses:
        '200':
          description: Customer updated.
        '400':
          description: Invalid request data.
        '404':
          description: Customer not found.
        '403':
          description: Insufficient permission.
    delete:
      summary: Delete customer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Customer deleted.
        '404':
          description: Customer not found.
        '403':
          description: Insufficient permission.
      x-design-note: Physical vs. logical deletion and retention rules are not defined in the SRS; the exact deletion behavior must be confirmed before implementation.
