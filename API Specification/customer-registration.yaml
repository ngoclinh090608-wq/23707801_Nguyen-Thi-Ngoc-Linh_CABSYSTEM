openapi: 3.0.3
info:
  title: CAB System API 01 - Customer Registration
  version: 1.0.0
  description: Đặc tả API đăng ký tài khoản khách hàng, truy vết từ SRS.
servers:
- url: /
  description: Server tương đối để hiển thị đặc tả trên Swagger; URL backend thực tế chưa được SRS xác định.
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      x-traceability:
        businessGoals:
        - BG-01
        businessRequirements:
        - BR-01
        functionalRequirements:
        - FR-01
        useCases:
        - UC-01
        businessRules:
        - RULE-01
        acceptanceCriteria:
        - AC-01
        nonFunctionalRequirements:
        - NFR-05
        - NFR-06
        entities:
        - Tài khoản
        - Khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Thông tin đăng ký. Các trường chi tiết chưa được SRS xác định.
              additionalProperties: true
      responses:
        '201':
          description: Đăng ký tài khoản thành công
        '400':
          description: Thông tin đăng ký không hợp lệ
