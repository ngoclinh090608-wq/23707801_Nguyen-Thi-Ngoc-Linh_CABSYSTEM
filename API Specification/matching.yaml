openapi: 3.0.3
info:
  title: CAB System - Driver Matching API
  version: 1.0.0
  description: Driver matching and driver response flow based on location, availability and operating criteria.
servers:
- url: /
  description: Relative server placeholder; actual backend URL is not specified in the SRS.
x-traceability:
  businessRequirements:
  - BR-03
  - BR-04
  functionalRequirements:
  - FR-06
  - FR-09
  - FR-10
  useCases:
  - UC-07
  - UC-09
  acceptanceCriteria:
  - AC-06
  - AC-08
  - AC-09
  - AC-10
  businessRules:
  - RULE-02
  - RULE-03
  - RULE-04
  - RULE-05
  - RULE-06
  exceptions:
  - EX-01
  - EX-02
  - EX-03
  notes:
  - Driver priority criteria and response timeout remain unspecified in the SRS.
paths:
  /trips/{tripId}/match:
    post:
      summary: Find and assign a suitable driver
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Suitable driver found or assignment process started.
        '404':
          description: No suitable driver found.
  /drivers/me/trip-requests/{tripId}:
    patch:
      summary: Accept or reject trip request
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - ACCEPT
                  - REJECT
      responses:
        '200':
          description: Driver response recorded.
