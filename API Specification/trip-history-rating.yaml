openapi: 3.0.3
info:
  title: CAB System API 05 - Trip History and Rating
  version: 1.0.0
  description: Đặc tả API xem lịch sử chuyến, số tiền phải trả và đánh giá tài xế.
servers:
- url: /
  description: Server tương đối để hiển thị đặc tả trên Swagger; URL backend thực tế chưa được SRS xác định.
paths:
  /customers/me/trips:
    get:
      summary: Xem lịch sử chuyến đi
      operationId: getCustomerTripHistory
      security:
      - bearerAuth: []
      x-traceability:
        businessGoals:
        - BG-02
        - BG-03
        businessRequirements:
        - BR-01
        functionalRequirements:
        - FR-04
        useCases:
        - UC-04
        acceptanceCriteria:
        - AC-04
        nonFunctionalRequirements:
        - NFR-05
        - NFR-06
        entities:
        - Khách hàng
        - Chuyến đi
      responses:
        '200':
          description: Lịch sử chuyến đi
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tripId:
                      type: string
                    status:
                      type: string
                    amountDue:
                      type: number
                      nullable: true
        '401':
          description: Chưa xác thực
  /trips/{tripId}/ratings:
    post:
      summary: Đánh giá tài xế sau chuyến
      operationId: rateDriver
      security:
      - bearerAuth: []
      x-traceability:
        businessGoals:
        - BG-02
        businessRequirements:
        - BR-01
        businessProcesses:
        - BPM-02
        functionalRequirements:
        - FR-04
        useCases:
        - UC-05
        acceptanceCriteria:
        - AC-04
        nonFunctionalRequirements:
        - NFR-05
        - NFR-06
        entities:
        - Đánh giá
        - Chuyến đi
        - Khách hàng
        - Tài xế
        note: SRS chỉ yêu cầu có thể đánh giá tài xế; cấu trúc chi tiết của đánh giá chưa được quy định.
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Nội dung đánh giá; chi tiết trường chưa được SRS quy định.
              additionalProperties: true
      responses:
        '201':
          description: Đánh giá được ghi nhận
        '400':
          description: Chuyến chưa đủ điều kiện đánh giá
        '401':
          description: Chưa xác thực
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
